<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo Web</title>
    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Título -->
    <h1 id="Titulo">Currículo Web</h1>
    
    <!-- Formulário -->
    <section id="editor">
        <h2>Editar Perfil</h2>
        <input type="text" id="nome" placeholder="Digite seu nome">
        <input type="text" id="cargo" placeholder="Cargo desejado">
        <textarea id="resumo" placeholder="Resumo profissional"></textarea>
        <button id="salvar">Salvar Perfil</button>
        <button id="remover">Remover Perfil</button>
        <button id="tema">Tema Escuro</button>
    </section>
    
    <!-- Mensagem -->
    <p id="notificacao" role="status" aria-live="polite" hidden></p>
    
    <!-- Currículo -->
    <section id="curriculo">
        <h1 id="nomePerfil">Seu Nome</h1>
        <h3 id="cargoPerfil">Cargo Desejado</h3>
        <h2>Sobre Mim</h2>
        <p id="resumoPerfil">Seu resumo profissional.</p>
    </section>
    
    <!-- Última visita -->
    <p id="visita"></p>
    
    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
